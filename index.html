    <style>
              @font-face {
        font-family: 'HL Hoctro';
        src: url('HLHOCTRO.TTF')
      }

              body{;max-width:1000px;margin:24px auto;padding:0 16px;color:#222;text-align:center;position:relative;min-height:100vh;
              }

          h1{font-size:20px;text-align:left;}
          input[type=file]{margin-top:8px}
          table{width:100%;border-collapse:collapse;margin-top:12px;text-align:left}
          th,td{border:1px solid #ddd;padding:8px;text-align:left}
          th{background:#f5f5f5}
          .hint{color:#555;font-size:13px;text-align:left;}
          .error{color:#b00020;text-align:left}
          .controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;justify-content:center}
          button{padding:8px 12px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer}
          #random-word{background:#009c3d;color:white;}
          #translate-btn{background:#ffbf00;color:white;}
          #translate-reverse-btn{background:#f51c1b;color:white;}

          /* Random word display */
          #randomWordContainer{display:none;flex-direction:column;align-items:center;padding-top:20px;margin-top:20px;max-width:100%;overflow:hidden;}
          #modeLabel{font-size:3vw;font-weight:bold;margin-bottom:10px;}
          #modeLabel.fill{color:blue;}
          #modeLabel.en2vi{color:deeppink;}
          #modeLabel.vi2en{color:green;}

          #randomWord{margin-top:40px;display:flex;flex-wrap:nowrap;justify-content:center;white-space:nowrap;font-size:10vw;opacity:0;transition:opacity 1s ease-in;max-width:100%;box-sizing:border-box;font-family: 'HL Hoctro';}
          #randomWord.show{opacity:1;animation:highlight 1.5s ease-in-out}
          .random-label{display:inline-block;text-align:center;border-bottom:3px solid #ccc;margin:2px;margin-bottom:15px}
          .random-label.visible{color:blue}
          .random-label.hidden{color:red}

          .hint-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:40px}
          .subtitle{font-size:36px;color:black;opacity:0;transition:opacity 1s ease-in;}
          .subtitle.show{opacity:1;animation:highlightSubtitle 1.5s ease-in-out}

          @keyframes highlight {
            0% { background-color: yellow; }
            100% { background-color: transparent; }
          }
          @keyframes highlightSubtitle {
            0% { background-color: lightgreen; }
            100% { background-color: transparent; }
          }

              .input-group {
        display: flex;
        align-items: center;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        padding: 6px;
          margin-bottom: 10px;
        gap: 6px;
        width: 1000px;
        box-sizing: border-box;
      }

      .input-group input {
        flex: 1;
        border: none;
        outline: none;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 15px;
        background-color: #f1f5f9;
        transition: all 0.25s ease;
      }

      .input-group input:focus {
        background-color: #fff;
        box-shadow: 0 0 0 2px #3b82f6;
      }

      .input-group button {
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .input-group button:hover {
        background: #2563eb;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(37,99,235,0.2);
      }

      .input-group button:active {
        transform: scale(0.97);
        box-shadow: none;
      }

              .custom-file-upload {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #f8fafc;
        border: 2px dashed #cbd5e1;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        transition: all 0.2s ease;
      }

      .custom-file-upload:hover {
        background: #f1f5f9;
      }

      .custom-file-upload input[type="file"] {
        display: none; /* Ẩn input gốc */
      }

     .br-card {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 190px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  padding: 14px;
  text-align: center;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: #222;
  z-index: 9999;

}

/* Nút đóng */

  position: absolute;
  top: 6px;

  font-size: 18px;
  cursor: pointer;

  transition: color .2s;
}

/* Ảnh QR */

  <body>
    <h1>Vocabulary Review</h1>
    <div class="input-group">
      <input id="txt_google_sheet" placeholder="Nhập link sheet public, tên sheet là Vocabulary" value="https://docs.google.com/spreadsheets/d/1zYGaKPYvT9_0c60qMY-PdCEWUucCdtWgvCGSvSInFRc/export?format=csv&id=1zYGaKPYvT9_0c60qMY-PdCEWUucCdtWgvCGSvSInFRc&gid=0" />
      <button id="google-sheet-btn">Đọc link google sheet</button>
    </div>
    <div class="input-group">
      <label class="custom-file-upload">

        <span id="fileName"
          >Chọn file Excel danh sách từ vựng. Cột A là ngôn ngữ 1, cột B là ngôn

    <!-- SheetJS (xlsx) library từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
          const input = document.getElementById('file-input');
          const tableWrap = document.getElementById('table-wrap');
          const errorEl = document.getElementById('error');
          const status = document.getElementById('status');
          const randomBtn = document.getElementById('random-word');
          const translateBtn = document.getElementById('translate-btn');
          const translateReverseBtn = document.getElementById('translate-reverse-btn');
          const backBtn = document.getElementById('back-btn');
          const googleSheetBtn = document.getElementById('google-sheet-btn');
          const randomWordDiv = document.getElementById('randomWord');
          const randomWordContainer = document.getElementById('randomWordContainer');
          const hintDiv = document.getElementById('hint');
          const revealBtn = document.getElementById('reveal-btn');
          const speakBtn = document.getElementById('speak-btn');
          const modeLabel = document.getElementById('modeLabel');
          let randomItem = null;

          let rows = [];
          let currentMode = null; // 'fill', 'en2vi', 'vi2en'
          let currentRow = null;

          // --- Hàm đọc cookie ---
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
          console.log(parts);
        if (parts.length === 2) return parts.pop().split(';').shift();
      }

      // --- Hàm ghi cookie (lưu 30 ngày) ---
      function setCookie(name, value, days = 30) {
        const date = new Date();
        date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${date.toUTCString()}; path=/`;
      }

      function formatGoogleSheetLink(url) {
        try {
          // Lấy ID của sheet giữa '/d/' và '/edit'
          const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
          if (!match) return null;
      
          const sheetId = match[1];
          const gidMatch = url.match(/gid=(\d+)/);
          const gid = gidMatch ? gidMatch[1] : "0";
      
          return `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&id=${sheetId}&gid=${gid}`;
        } catch (e) {
          console.error("Lỗi khi format link:", e);
          return null;
        }
      }

          // --- Khi load trang ---
      window.addEventListener('DOMContentLoaded', () => {
        let savedLink = "";
        const input = document.getElementById('txt_google_sheet');
        let url_cookie = getCookie('tvonly-sheet-link')

        if(url_cookie !== undefined && url_cookie !== ""){
          savedLink = decodeURIComponent(url_cookie);
        }
        else
        {
          savedLink = 'https://docs.google.com/spreadsheets/d/1zYGaKPYvT9_0c60qMY-PdCEWUucCdtWgvCGSvSInFRc/export?format=csv&id=1zYGaKPYvT9_0c60qMY-PdCEWUucCdtWgvCGSvSInFRc&gid=0';
        }
        // Nếu chưa có cookie thì gán link mặc định
        input.value = savedLink;

      });

          function resetUI() {
              tableWrap.innerHTML = '';
              errorEl.textContent = '';
              status.textContent = '';
              randomBtn.disabled = true;
              translateBtn.disabled = true;
              translateReverseBtn.disabled = true;
              backBtn.disabled = true;
              revealBtn.disabled = true;
              speakBtn.disabled = true;
              randomWordDiv.innerHTML = '';
              randomWordDiv.classList.remove('show');
              hintDiv.textContent = '';
              hintDiv.classList.remove('show');
              randomWordContainer.style.display = 'none';
              currentMode = null;
              currentRow = null;
              modeLabel.textContent = '';
              modeLabel.className = '';
          }
          //const sheetUrl = 'https://docs.google.com/spreadsheets/d/1zYGaKPYvT9_0c60qMY-PdCEWUucCdtWgvCGSvSInFRc/export?format=csv&id=1zYGaKPYvT9_0c60qMY-PdCEWUucCdtWgvCGSvSInFRc&gid=0';

          async function readGoogleSheet(sheetUrl) {
              try {
                  resetUI();
                  status.textContent = 'Đang tải dữ liệu từ Google Sheet...';

                  sheetUrl = formatGoogleSheetLink(sheetUrl)

                  // Tải CSV trực tiếp từ link Google Sheets
                  const response = await fetch(sheetUrl);
                  if (!response.ok) throw new Error('Không thể tải dữ liệu từ Google Sheets');
                  const csvText = await response.text();

                  // Dùng XLSX để parse CSV thành sheet
                  const workbook = XLSX.read(csvText, { type: 'string' });
                  const firstSheetName = workbook.SheetNames[0];
                  const sheet = workbook.Sheets[firstSheetName];
                  const sheetRange = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });

                  rows = sheetRange.map(r => [r[0] ?? '', r[1] ?? '']);
                  makeTable(rows);

                  randomBtn.disabled = false;
                  translateBtn.disabled = false;
                  translateReverseBtn.disabled = false;
                  randomItem = createRandomPicker(rows);

                  status.textContent = '✅ Đã đọc xong Google Sheet';
              } catch (err) {
                  console.error(err);
                  errorEl.textContent = 'Lỗi khi đọc sheet: ' + (err.message || err);
                  status.textContent = '';
              }
          }

          function speak(txtToSpeak) {
              console.log("speak: " + txtToSpeak);
              if (txtToSpeak == '')
                  return;
              const text = txtToSpeak;
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.pitch = 0.75;
              utterance.rate = 0.75;
              if(!isJapanese(txtToSpeak))
                utterance.lang = 'en-US'; // giọng tiếng Anh Mỹ
              else
                utterance.lang = "ja-JP"; // giọng tiếng Anh Mỹ

              speechSynthesis.speak(utterance);
          }

          function makeTable(data) {
              if (!data.length) {
                  tableWrap.innerHTML = '<p class="hint">Không có dữ liệu trong cột A và B.</p>';
                  return;
              }
              const table = document.createElement('table');
              const thead = document.createElement('thead');
              thead.innerHTML = '<tr><th>Hàng</th><th>Cột A</th><th>Cột B</th></tr>';
              table.appendChild(thead);
              const tbody = document.createElement('tbody');
              data.forEach((r, i) => {
                  const tr = document.createElement('tr');
                  const idx = document.createElement('td');
                  idx.textContent = i + 1;
                  const a = document.createElement('td');
                  a.textContent = r[0] ?? '';
                  const b = document.createElement('td');
                  b.textContent = r[1] ?? '';
                  tr.appendChild(idx);
                  tr.appendChild(a);
                  tr.appendChild(b);
                  tbody.appendChild(tr);
              });
              table.appendChild(tbody);
              tableWrap.innerHTML = '';
              tableWrap.appendChild(table);
              status.textContent = `Đã đọc ${data.length} hàng từ sheet "Vocabulary"`;
          }

          input.addEventListener('change', async (ev) => {
              resetUI();
              const file = ev.target.files && ev.target.files[0];
              if (!file) return;
              status.textContent = `Đang đọc: ${file.name}`;
              try {
                  const data = await file.arrayBuffer();
                  const workbook = XLSX.read(data, { type: 'array' });
                  const firstSheetName = workbook.SheetNames[0];
                  const sheet = workbook.Sheets[firstSheetName];
                  const sheetRange = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });
                  rows = sheetRange.map(r => [r[0] ?? '', r[1] ?? '']);
                  makeTable(rows);
                  randomBtn.disabled = false;
                  translateBtn.disabled = false;
                  translateReverseBtn.disabled = false;
                  randomItem = createRandomPicker(rows);
              } catch (err) {
                  console.error(err);
                  errorEl.textContent = 'Lỗi khi đọc file: ' + (err.message || err);
                  status.textContent = '';
              }
          });

          function shuffleArray(a) {
              for (let i = a.length - 1; i > 0; i--) {
                  const j = Math.floor(Math.random() * (i + 1));
                  [a[i], a[j]] = [a[j], a[i]];
              }
          }

function createRandomPicker(array) {
  let pool = [];
  let index = 0;

  function shuffle() {
    pool = [...array];
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    index = 0;
  }

  shuffle(); // trộn lần đầu

  return function getNext() {
    if (index >= pool.length) {
      shuffle(); // hết thì tự reset
    }
    return pool[index++];
  };
}

          function adjustFontSize() {
              const container = randomWordDiv;
              let fontSize = 7; // in vw
              container.style.fontSize = fontSize + 'vw';
              while (container.scrollWidth > container.clientWidth && fontSize > 1) {
                  fontSize -= 0.5;
                  container.style.fontSize = fontSize + 'vw';
              }
          }

          function pickRandomRow() {
              const validRows = rows.filter(r => r[0] || r[1]);
              if (!validRows.length) {
                  errorEl.textContent = 'Không có dữ liệu trong cột A hoặc B';
                  return null;
              }
              //return validRows[Math.floor(Math.random() * validRows.length)];

return randomItem();






          }

          function isJapanese(text) {
return false;
            const japaneseRegex = /[\u3040-\u30FF\u4E00-\u9FBF]/;
            return japaneseRegex.test(text);
          }

          randomBtn.addEventListener('click', () => {
              fillintheblank('half');
          });

          function fillintheblank(mode) {

              if (mode == 'half') {

                  currentMode = 'fill';
                  currentRow = pickRandomRow();
                  if (!currentRow) return;
                  modeLabel.textContent = 'Nhiệm vụ thử thách: Điền từ vào chỗ trống';
                  modeLabel.className = 'fill';

                  const randWord = String(currentRow[0]);
                  const hint = currentRow[1] ?? '';
                  tableWrap.style.display = 'none';
                  status.textContent = '';
                  randomWordDiv.innerHTML = '';
                  hintDiv.textContent = '';
                  randomWordDiv.classList.remove('show');
                  hintDiv.classList.remove('show');

                  const chars = randWord.split('');
                  const positions = [];
                  chars.forEach((c, i) => { if (c !== ' ') positions.push(i); });
                  const nonSpaceCount = positions.length;
                  let hideCount = Math.floor(nonSpaceCount / 3);
                  if (nonSpaceCount < 3) hideCount = 1;

                  shuffleArray(positions);
                  console.log(positions);
                  const hideIndices = new Set(positions.slice(0, hideCount));
                  console.log(hideIndices);

                  chars.forEach((c, i) => {
                      const span = document.createElement('span');
                      span.classList.add('random-label');
                      if (c === ' ') {
                          span.textContent = '\u00A0';
                          span.style.borderBottom = 'none';
                      } else if (hideIndices.has(i)) {
                          span.dataset.ch = c;
                          span.textContent = '_';
                          span.classList.add('hidden');
                      } else {
                          span.textContent = c;
                          span.classList.add('visible');
                      }
                      randomWordDiv.appendChild(span);
                  });

                  // Hiển thị gợi ý (cột B) ngay khi vào chế độ Điền từ
                  hintDiv.textContent = hint;
                  requestAnimationFrame(() => hintDiv.classList.add('show'));

                  revealBtn.disabled = false;
                  speakBtn.disabled = false;
                  randomWordContainer.style.display = 'flex';
                  requestAnimationFrame(() => {
                      randomWordDiv.classList.add('show');
                      adjustFontSize();
                  });
                  backBtn.disabled = false;
              } else {
                  currentMode = 'fill';
                  currentRow = pickRandomRow();
                  if (!currentRow) return;
                  modeLabel.textContent = 'Nhiệm vụ thử thách: Điền từ vào chỗ trống';
                  modeLabel.className = 'fill';

                  const randWord = String(currentRow[0]);
                  const hint = currentRow[1] ?? '';
                  tableWrap.style.display = 'none';
                  status.textContent = '';
                  randomWordDiv.innerHTML = '';
                  hintDiv.textContent = '';
                  randomWordDiv.classList.remove('show');
                  hintDiv.classList.remove('show');

                  const chars = randWord.split('');
                  const positions = [];
                  chars.forEach((c, i) => { if (c !== ' ') positions.push(i); });
                  const nonSpaceCount = positions.length;
                  let hideCount = nonSpaceCount;
                  if (nonSpaceCount < 3) hideCount = 1;

                  shuffleArray(positions);
                  const hideIndices = new Set(positions.slice(0, hideCount));

                  chars.forEach((c, i) => {
                      const span = document.createElement('span');
                      span.classList.add('random-label');
                      if (c === ' ') {
                          span.textContent = '\u00A0';
                          span.style.borderBottom = 'none';
                      } else if (i != 0) {
                          span.dataset.ch = c;
                          span.textContent = '_';
                          span.classList.add('hidden');
                      } else {
                          span.textContent = c;
                          span.classList.add('visible');
                      }
                      randomWordDiv.appendChild(span);
                  });

                  // Hiển thị gợi ý (cột B) ngay khi vào chế độ Điền từ
                  hintDiv.textContent = hint;
                  requestAnimationFrame(() => hintDiv.classList.add('show'));

                  revealBtn.disabled = false;
                  speakBtn.disabled = false;
                  randomWordContainer.style.display = 'flex';
                  requestAnimationFrame(() => {
                      randomWordDiv.classList.add('show');
                      adjustFontSize();
                  });
                  backBtn.disabled = false;
              }
          }

          googleSheetBtn.addEventListener('click', () => {

              // --- Khi nhấn nút lưu ---
          const newLink = document.getElementById('txt_google_sheet').value.trim();
          if (newLink) {
            setCookie('tvonly-sheet-link', newLink);
            console.log('Đã lưu link vào cookie!');
          }

              readGoogleSheet(newLink);
          });

          translateBtn.addEventListener('click', () => {
              currentMode = 'en2vi';
              currentRow = pickRandomRow();
              if (!currentRow) return;
              modeLabel.textContent = 'Nhiệm vụ thử thách: Đọc lớn và dịch nghĩa sang tiếng Việt';
              modeLabel.className = 'en2vi';

              const randWord = String(currentRow[0]);
              const hint = currentRow[1] ?? '';
              tableWrap.style.display = 'none';
              status.textContent = '';
              randomWordDiv.innerHTML = '';
              hintDiv.textContent = '';
              randomWordDiv.classList.remove('show');
              hintDiv.classList.remove('show');

              const chars = randWord.split('');
              chars.forEach((c, i) => {
                  const span = document.createElement('span');
                  span.classList.add('random-label', 'visible');
                  span.textContent = c === ' ' ? '\u00A0' : c;
                  if (c === ' ') span.style.borderBottom = 'none';
                  randomWordDiv.appendChild(span);
              });

              revealBtn.disabled = false;
              speakBtn.disabled = false;
              randomWordContainer.style.display = 'flex';
              requestAnimationFrame(() => {
                  randomWordDiv.classList.add('show');
                  adjustFontSize();
              });
              backBtn.disabled = false;
          });

          translateReverseBtn.addEventListener('click', () => {
              fillintheblank('full');
          });

          revealBtn.addEventListener('click', () => {
              if (!currentRow) return;
              if (currentMode === 'fill') {
                  const labels = document.querySelectorAll('#randomWord .random-label');
                  labels.forEach(lbl => {
                      if (lbl.dataset.ch) {
                          lbl.textContent = lbl.dataset.ch;
                          lbl.classList.remove('hidden');
                          lbl.classList.add('visible');
                          delete lbl.dataset.ch;
                      }
                  });
              } else if (currentMode === 'en2vi') {
                  hintDiv.textContent = currentRow[1] ?? '';
                  requestAnimationFrame(() => hintDiv.classList.add('show'));
              } else if (currentMode === 'vi2en') {
                  hintDiv.textContent = currentRow[0] ?? '';
                  requestAnimationFrame(() => hintDiv.classList.add('show'));
              }
              revealBtn.disabled = true;
          });

          speakBtn.addEventListener('click', () => {
              console.log(currentRow[0]);
              if (!currentRow) return;
              if (currentMode === 'fill') {
                  console.log(currentRow[0]);
                  speak(currentRow[0] ?? '');
              } else if (currentMode === 'en2vi') {
                  speak(currentRow[0] ?? '');
              } else if (currentMode === 'vi2en') {
                  speak(currentRow[0] ?? '');
              }
          });

          backBtn.addEventListener('click', () => {
              randomWordDiv.innerHTML = '';
              randomWordDiv.classList.remove('show');
              hintDiv.textContent = '';
              hintDiv.classList.remove('show');
              randomWordContainer.style.display = 'none';
              tableWrap.style.display = '';
              revealBtn.disabled = true;
              backBtn.disabled = true;
              currentRow = null;
              currentMode = null;
              modeLabel.textContent = '';
              modeLabel.className = '';
              if (rows.length) {
                  status.textContent = `Đã đọc ${rows.length} hàng từ sheet \"Vocabulary\"`;
              }
          });

          resetUI();
    </script>
